<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title-1"></title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/swiper-bundle.min.css" />
    <style>
      body {
        background-image: url("./assets/images/background.png");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;
        overflow: hidden;
        opacity: 1;
      }
      .page-title {
        position: fixed;
        top: 5%;
        left: 50%;
        width: 22vw;
        height: 5vw;
        text-align: center;
        z-index: 300;
        border-radius: 0 0 2vw 2vw; /* only bottom rounded */
        transform: translate(-50%, -50%) scale(1);
        background-color: #ffd78d;
        box-shadow: 0 0.5vw 0.2vw rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .page-title span {
        font-size: 3vw;
      }
      .language-container {
        position: fixed;
        top: 2.5vw;
        right: 5%;
        display: flex;
        width: 9vw;
        padding: 0.2vw 0.3vw;
        height: auto;
        justify-content: space-between;
        align-items: center;
        font-family: "BalooRegular";
        border: 0.3vw solid white;
        background-color: transparent;
        border-radius: 50vw;
        z-index: 900;
        transform: translateX(0vw);
        opacity: 1;
        pointer-events: none;
        transition: transform 0.8s ease;
      }

      .language-container div {
        width: 2.5vw;
        height: 2.5vw;
        font-size: 1.6vw;
        text-align: center;
        border: 0.3vw solid white;
        background: transparent !important;
        color: white;
        pointer-events: auto;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        font-family: "BalooRegular", sans-serif;
      }

      .language-container div:hover {
        background-color: white !important;
        color: #6168ea;
      }

      .language-container div.active {
        background-color: white !important;
        color: #6168ea;
      }

      .home-btn {
        transform: translateX(0vw);
        opacity: 1;
        pointer-events: auto;
        transition: transform 0.8s ease;
        cursor: pointer;
      }

      .swiper-section {
        position: relative;
        width: 100%;
        padding: 2vw 0;
        overflow: hidden;
        margin-top: 8vw;

        display: flex;
        justify-content: center;
      }

      .mySwiper {
        width: 100%;
        max-width: 100%;
        overflow: visible;
        direction: rtl; /* makes remaining slides stay on the left */
      }

      .mySwiper .swiper-wrapper {
        align-items: center;
      }

      .mySwiper .swiper-slide {
        width: 40vw;
        display: flex;
        justify-content: center;
        align-items: center;
        transition:
          transform 0.4s ease,
          filter 0.4s ease;
      }

      .mySwiper .swiper-slide-active {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }

      .mySwiper .swiper-slide-prev,
      .mySwiper .swiper-slide-next {
        transform: scale(0.85);
        filter: blur(0.2vw);
      }

      .custom-card {
        position: relative;
        width: 100%;
        height: 25vw;
        background: white;
        border: 0.5vw solid #f2c76f;
        border-radius: 1.5vw;
        box-shadow: 0 0.8vw 1.6vw rgba(0, 0, 0, 0.18);
        padding: 1vw;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        text-align: center;
      }

      .custom-card div {
        font-family: "BalooRegular", sans-serif;
        font-size: 4vw;
        color: #5e2bb0;
        line-height: 1.1;
      }

      .custom-card p {
        position: absolute;
        width: 80%;
        font-family: "BalooRegular", sans-serif;
        font-size: 2vw;
        line-height: 1.5;
        color: #5e2bb0;
        left: 50%;
        top: 50%;
        margin-top: 3vw;
        transform: translate(-50%, -50%);
      }

      .swiper-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 4.5vw;
        height: 4.5vw;
        z-index: 20;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .swiper-nav img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .prev-btn {
        left: 20%;
        display: none;
      }

      .next-btn {
        right: 20%;
      }

      .topic-container {
        position: absolute;
        bottom: 19%;
        left: 50%;
        transform: translateX(-50%);
        width: 45%;
        display: flex;
        justify-content: space-between;
      }
      .topic-container .topic {
        text-decoration: none;
        padding: 0.5vw 0vw;
        z-index: 900;
        background-color: transparent;
        border: 0.3vw solid #ffd78d;
        border-radius: 20vw;
        text-align: center;
        color: white;
        font-family: "BalooRegular";
        font-size: 1.5vw;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .topic-1 {
        background-color: #ffd78d !important;
        color: #5e29a5 !important;
      }

      .topic-2 {
      }

      .topic:hover {
        background-color: #ffd78d;
        color: #5e29a5;
      }

      .custom-card video {
        width: 40%;
        border-radius: 0.5vw;
      }
    </style>
  </head>
  <body>
    <div class="page-title">
      <span data-lang-key="title"></span>
    </div>
    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujrati">G</div>
    </div>
    <a class="home-button home-btn" href="index.html">
      <img src="./assets/images/home.png" alt="" />
    </a>

    <div class="swiper-section">
      <div class="swiper mySwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <div class="custom-card">
              <video src="./assets/videos/1.mp4" autoplay muted loop></video>
              <p data-lang-key="slide-2.1"></p>
            </div>
          </div>

          <div class="swiper-slide">
            <div class="custom-card">
              <video src="./assets/videos/2.mp4" autoplay muted loop></video>
              <p data-lang-key="slide-2.2"></p>
            </div>
          </div>

          <div class="swiper-slide">
            <div class="custom-card">
              <video src="./assets/videos/3.mp4" autoplay muted loop></video>
              <p data-lang-key="slide-2.3"></p>
            </div>
          </div>

          <div class="swiper-slide">
            <div class="custom-card">
              <video src="./assets/videos/4.mp4" autoplay muted loop></video>
              <p data-lang-key="slide-2.4"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="swiper-nav prev-btn">
        <img src="./assets/images/prev-btn.png" alt="Previous" />
      </div>

      <div class="swiper-nav next-btn">
        <img src="./assets/images/next-btn.png" alt="Next" />
      </div>
    </div>
    <div class="topic-container">
      <a href="instruction.html" class="topic topic-1" data-lang-key="title-1">
      </a>
      <a
        href="types-of-fast.html"
        class="topic topic-2"
        data-lang-key="title-2"
      ></a>
    </div>
    <script src="./assets/js/swiper-bundle.min.js"></script>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/app.js"></script>
    <script>
      const prevBtn = document.querySelector(".prev-btn");
      const nextBtn = document.querySelector(".next-btn");

      const swiper = new Swiper(".mySwiper", {
        slidesPerView: "auto",
        centeredSlides: true,
        spaceBetween: window.innerWidth * 0.15, // ~8vw gap
        speed: 700,
        loop: false,
        initialSlide: 0,

        on: {
          init: function () {
            updateButtons(this);
          },
          slideChange: function () {
            updateButtons(this);
          },
        },
      });

      function updateButtons(swiperInstance) {
        prevBtn.style.display = swiperInstance.isBeginning ? "none" : "flex";
        nextBtn.style.display = "flex"; // always visible, even on last slide
      }

      nextBtn.addEventListener("click", function () {
        if (swiper.isEnd) {
          window.location.href = "pranam.html";
        } else {
          swiper.slideNext();
        }
      });

      prevBtn.addEventListener("click", function () {
        swiper.slidePrev();
      });
    </script>
  </body>
</html>
